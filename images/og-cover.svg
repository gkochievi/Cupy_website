<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF5F1"/>
      <stop offset="60%" stop-color="#F8F6F1"/>
      <stop offset="100%" stop-color="#FFF3E6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="180" cy="120" r="120" fill="#6BAF82" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1060" cy="120" r="160" fill="#E8872B" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1020" cy="540" r="180" fill="#2D5A3D" opacity="0.07" filter="url(#soft)"/>

  <!-- cup icon -->
  <g transform="translate(520,145)">
    <path d="M20 30h80a8 8 0 0 1 8 8v56a34 34 0 0 1-34 34H54a34 34 0 0 1-34-34V38a8 8 0 0 1 8-8z" fill="none" stroke="#2D5A3D" stroke-width="5"/>
    <path d="M108 44h12a16 16 0 0 1 0 32h-12" fill="none" stroke="#2D5A3D" stroke-width="5"/>
    <path d="M48 8c0 0 4-8 0-16" stroke="#E8872B" stroke-width="5" stroke-linecap="round"/>
    <path d="M64 12c0 0 4-8 0-16" stroke="#E8872B" stroke-width="5" stroke-linecap="round"/>
    <path d="M80 8c0 0 4-8 0-16" stroke="#E8872B" stroke-width="5" stroke-linecap="round"/>
    <line x1="14" y1="138" x2="112" y2="138" stroke="#2D5A3D" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- brand -->
  <text x="600" y="370" text-anchor="middle" font-family="'New Hero','Nunito','Arial',sans-serif" font-size="124" font-weight="700" fill="#1B3C28">
    хафи<tspan fill="#E8872B">.</tspan>cupy
  </text>
  <text x="600" y="430" text-anchor="middle" font-family="'New Hero','Nunito','Arial',sans-serif" font-size="46" letter-spacing="8" fill="#E8872B">
    COFFEE BAR
  </text>
  <text x="600" y="490" text-anchor="middle" font-family="'New Hero','Nunito','Arial',sans-serif" font-size="34" fill="#3D5C4A">
    Best Coffee Bar in Tbilisi
  </text>
</svg>
